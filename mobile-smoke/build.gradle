// AGP 8.12.0 -- the exact version react-native@0.86.2's own gradle-plugin
// pins (mobile/node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml),
// already proven compatible with this repo's Gradle wrapper (9.3.1) and this
// CI's JDK 17 across several real successful builds. Reused here deliberately
// instead of guessing a fresh version combination for a project nothing has
// actually run yet.
plugins {
    id 'com.android.application' version '8.12.0' apply false
}
