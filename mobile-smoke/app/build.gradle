plugins {
    id 'com.android.application'
}

// Deliberately no Kotlin, no React Native, no Expo, no third-party SDKs --
// this project exists purely to give Firebase Test Lab a valid app +
// androidTest APK pair that builds in well under a minute, so the GCP-side
// pipeline (auth, IAM, enabled APIs, billing, device selection, actually
// invoking `gcloud firebase test android run`) can be iterated on without
// paying mobile/'s ~14 min Gradle build cost each time. Debug build type
// (Android's auto-generated debug keystore) on purpose -- the release +
// testBuildType workaround in mobile/.detoxrc.js exists only because Detox's
// release-mode testing needs it; this project doesn't use Detox at all.
android {
    namespace 'com.fathom.smoketest'
    compileSdk 35

    defaultConfig {
        applicationId "com.fathom.smoketest"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
