# Basic hygiene check: the app launches, and a signed-out user sees the
# sign-in screen (not a crash, not a blank screen). This is the only flow
# that doesn't need a real session -- see mobile/README.md's "Automated
# testing" section for why authenticated flows (Home, Ask, Plaid Link,
# Rules, editing) aren't automated yet.
appId: com.fathom.app
---
- launchApp:
    clearState: true
- assertVisible: "Fathom"
- assertVisible: "Continue with Google"
