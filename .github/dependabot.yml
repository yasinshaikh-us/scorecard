version: 2
updates:
  # Root package.json -- just the Vitest runner for the Deno-based Edge
  # Functions' shared TS helpers (supabase/functions/_shared/*.test.ts).
  # There is no web app here any more; this tree exists only to run those
  # backend tests under Node.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Mobile app (mobile/package.json) -- Expo SDK 57 / React Native 0.86 pin
  # a lot of interdependent versions tightly (see mobile/AGENTS.md), so
  # major bumps stay excluded from grouping and land as their own PR to
  # review individually rather than folded into a batch.
  - package-ecosystem: npm
    directory: "/mobile"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions used across ci.yml / mobile-ci.yml / mobile-detox.yml /
  # mobile-build.yml (actions/checkout, actions/setup-node, actions/cache,
  # actions/upload-artifact, reactivecircus/android-emulator-runner).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
