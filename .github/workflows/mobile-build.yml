name: Mobile Build

# Stage 2 of the mobile testing pyramid: confirms the app actually
# compiles into a real native binary via EAS Build, not just that the JS
# bundles cleanly (Stage 1's tsc/jest/expo-export can't catch a broken
# Gradle config or native-module linking issue -- react-native-plaid-link-sdk
# in particular). Runs in Expo's cloud, so this needs no Xcode/Android
# Studio here, only an EXPO_TOKEN repo secret (see mobile/README.md for
# how to create one).
#
# Manual-dispatch only -- EAS build minutes aren't unlimited on free
# tiers, and there's no reason to burn them on every push while the app
# is under active development. Installing and opening the resulting build
# is the final human gate (see mobile/README.md's testing pyramid).

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build for"
        required: true
        default: "android"
        type: choice
        options: ["android", "ios", "all"]
      profile:
        description: "eas.json build profile"
        required: true
        default: "preview"
        type: choice
        options: ["development", "preview", "production"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --legacy-peer-deps
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # A robot token (EXPO_TOKEN) can't do the interactive "create a
      # project for @account/slug?" prompt eas build normally shows on an
      # app's first build. `eas init` links (or, first run only, creates)
      # the EAS project non-interactively using app.json's "owner" field,
      # and no-ops on every run after the first since it matches by slug.
      - name: EAS init
        run: eas init --non-interactive

      - name: EAS build
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --wait
