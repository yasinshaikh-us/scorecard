name: Mobile Build

# Stage 3 (final automated stage) of the mobile testing pyramid: produces
# the actual human-installable binary via EAS Build. Deliberately last --
# EAS build minutes are the one paid/metered resource in this pyramid, so
# they're only spent once Stage 1 (fast checks) and Stage 2
# (mobile-detox.yml's real scripted UI flows on a real Android emulator
# booted directly on the runner, no paid or third-party service) have
# already given confidence the app works, rather than packaging a build
# that might be broken in ways only device-level testing catches.
#
# Confirms the app compiles into a real native binary via EAS's own cloud
# build -- a different toolchain than Stage 2's direct Gradle invocation,
# with its own project-linking/credential handling that can fail
# independently of Gradle itself (see mobile/README.md). Runs in Expo's
# cloud, so this needs no Xcode/Android Studio here, only an EXPO_TOKEN
# repo secret (see mobile/README.md for how to create one).
#
# Manual-dispatch only -- EAS build minutes aren't unlimited on free
# tiers, and there's no reason to burn them on every push while the app
# is under active development. Installing and opening the resulting build
# is the final human gate (see mobile/README.md's testing pyramid).

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build for"
        required: true
        default: "android"
        type: choice
        options: ["android", "ios", "all"]
      profile:
        description: "eas.json build profile"
        required: true
        default: "preview"
        type: choice
        options: ["development", "preview", "production"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --legacy-peer-deps
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS build
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --wait
