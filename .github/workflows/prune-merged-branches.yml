name: Repo housekeeping

# Two one-shot chores that can't be driven from a Claude Code session,
# because the agent proxy refuses both of the API paths they need:
# ref deletion (403 on `git push --delete` and `DELETE /git/refs/*`) and
# /actions/secrets + /actions/variables (403 on read). A runner using the
# workflow's own GITHUB_TOKEN and `secrets` context reaches both.
#
# Delete this file once the chores are done -- it is not meant to stay.

on:
  workflow_dispatch:
    inputs:
      prune_branches:
        description: "Prune merged branches under the prefix"
        type: boolean
        default: true
      dry_run:
        description: "Only report what would be deleted"
        type: boolean
        default: true
      prefix:
        description: "Only consider branches under this prefix"
        type: string
        default: "claude/"
      audit_secrets:
        description: "Report which Actions secrets/variables no code references"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: repo-housekeeping
  cancel-in-progress: false

jobs:
  prune:
    if: inputs.prune_branches
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // workflow_dispatch inputs arrive on the event payload as
            // strings, even when declared `type: boolean` -- and
            // core.getInput() would look for an INPUT_* env var that
            // only exists for keys passed under this step's `with:`.
            // Defaulting to a dry run means a malformed value errs
            // toward doing nothing.
            const dryRun = context.payload.inputs.dry_run !== 'false';
            const prefix = context.payload.inputs.prefix || 'claude/';
            const { owner, repo } = context.repo;

            const { data: repoInfo } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoInfo.default_branch;

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100,
            });

            const candidates = branches
              .map((b) => b.name)
              .filter((n) => n.startsWith(prefix) && n !== defaultBranch)
              .sort();

            core.info(`${candidates.length} branch(es) under "${prefix}" to assess`);

            // A branch is only safe to delete when every pull request
            // that ever pointed at it is closed AND at least one of them
            // merged. That second half matters: a branch whose only PR
            // was closed unmerged still holds the sole copy of that work,
            // and ancestry can't tell us otherwise because this repo
            // squash-merges (the branch tip is never an ancestor of the
            // default branch, merged or not).
            const deletable = [];
            const skipped = [];

            for (const branch of candidates) {
              const prs = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'all', head: `${owner}:${branch}`, per_page: 100,
              });

              if (prs.length === 0) {
                skipped.push([branch, 'no pull request ever opened']);
              } else if (prs.some((p) => p.state === 'open')) {
                const open = prs.filter((p) => p.state === 'open').map((p) => `#${p.number}`);
                skipped.push([branch, `still open: ${open.join(', ')}`]);
              } else if (!prs.some((p) => p.merged_at)) {
                const closed = prs.map((p) => `#${p.number}`);
                skipped.push([branch, `closed without merging: ${closed.join(', ')}`]);
              } else {
                const merged = prs.filter((p) => p.merged_at).map((p) => `#${p.number}`);
                deletable.push([branch, merged.join(', ')]);
              }
            }

            const failures = [];
            for (const [branch, merged] of deletable) {
              if (dryRun) continue;
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
              } catch (err) {
                failures.push([branch, err.status === 422 ? 'already gone' : err.message]);
              }
            }

            const lines = [
              `**Default branch:** \`${defaultBranch}\` (never a candidate)`,
              `**Mode:** ${dryRun ? 'dry run -- nothing deleted' : 'live'}`,
              '',
              `### ${dryRun ? 'Would delete' : 'Deleted'} (${deletable.length})`,
              ...(deletable.length
                ? ['| Branch | Merged in |', '| --- | --- |',
                   ...deletable.map(([b, m]) => `| \`${b}\` | ${m} |`)]
                : ['_None._']),
              '',
              `### Kept (${skipped.length})`,
              ...(skipped.length
                ? ['| Branch | Why |', '| --- | --- |',
                   ...skipped.map(([b, why]) => `| \`${b}\` | ${why} |`)]
                : ['_None._']),
            ];

            if (failures.length) {
              lines.push('', `### Failed (${failures.length})`, '| Branch | Error |', '| --- | --- |',
                ...failures.map(([b, e]) => `| \`${b}\` | ${e} |`));
            }

            await core.summary.addRaw(lines.join('\n')).write();
            core.info(lines.join('\n'));

            if (failures.length) {
              core.setFailed(`${failures.length} branch(es) could not be deleted`);
            }

  audit:
    if: inputs.audit_secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `toJSON(secrets)` is the only way to enumerate configured secret
      # names: the REST list endpoint needs a PAT with repo-admin scope,
      # which GITHUB_TOKEN can never have. Only the KEYS are ever emitted
      # -- and the JSON reaches the step through the environment rather
      # than through an interpolated shell string, so a secret containing
      # a quote can't break out of the command it lands in.
      - name: Compare configured secrets and variables against references
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail

          # github_token is injected into the context by Actions itself,
          # not configured by anyone, so it is never a cleanup candidate.
          jq -r 'keys[]' <<<"$SECRETS_JSON" | grep -vix 'github_token' | sort -u > /tmp/have-secrets
          jq -r 'keys[]' <<<"$VARS_JSON" | sort -u > /tmp/have-vars

          # Two different questions, and conflating them is how a
          # live secret gets deleted or a dead one kept:
          #
          #   1. Does a workflow consume it? Only `secrets.NAME` in
          #      .github/workflows makes an Actions secret do anything.
          #      Nothing else in the tree can read one.
          #   2. Is the name known to the repo at all? A name can appear
          #      in .env.example, a script, or the docs while no workflow
          #      touches it -- typically because the value lives in
          #      another store (Supabase's function env) and GitHub holds
          #      a stale copy. Dead here, but worth naming rather than
          #      silently dropping.
          #
          # Bucket 1 is the safety check; bucket 2 is the explanation.
          classify() {
            local ctx="$1"
            while read -r name; do
              [ -z "$name" ] && continue
              if grep -rqE "$ctx\\.$name([^A-Za-z0-9_]|$)" .github/workflows; then
                echo "live $name consumed by a workflow"
              elif grep -rqF "$name" . --exclude-dir=.git --exclude-dir=.github; then
                local where
                where=$(grep -rlF "$name" . --exclude-dir=.git --exclude-dir=.github | head -3 | sed 's|^\./||' | tr '\n' ' ' | sed 's/ $//')
                echo "dead $name no workflow reads it; name appears in $where"
              else
                echo "dead $name referenced nowhere"
              fi
            done
          }

          classify secrets < /tmp/have-secrets > /tmp/secret-report
          classify vars < /tmp/have-vars > /tmp/var-report

          emit() {
            local label="$1" file="$2"
            local dead live
            dead=$(grep -c '^dead ' "$file" || true)
            live=$(grep -c '^live ' "$file" || true)
            {
              echo "### $label"
              echo
              # Deliberately not "safe to delete" flatly: a name here
              # may still be a live secret in Supabase's function env,
              # where the app actually reads it. What is dead is the
              # GitHub *copy*, which nothing can consume.
              echo "**Inert ($dead)** -- no workflow can read these, so deleting the GitHub copy changes no behaviour. Read the Why column before deleting the value anywhere else:"
              echo
              if [ "$dead" -gt 0 ]; then
                echo "| Name | Why |"
                echo "| --- | --- |"
                sed -n 's/^dead \([^ ]*\) \(.*\)$/| `\1` | \2 |/p' "$file"
              else
                echo "_None._"
              fi
              echo
              echo "<details><summary>In use ($live)</summary>"
              echo
              if [ "$live" -gt 0 ]; then
                sed -n 's/^live \([^ ]*\) .*$/- `\1`/p' "$file"
              else
                echo "_None._"
              fi
              echo
              echo "</details>"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          }

          emit "Actions secrets" /tmp/secret-report
          emit "Actions variables" /tmp/var-report

          echo "--- plain-text copy for the run log ---"
          echo "SECRETS:"; cat /tmp/secret-report
          echo "VARIABLES:"; cat /tmp/var-report
