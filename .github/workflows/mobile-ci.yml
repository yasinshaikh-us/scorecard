name: Mobile CI

# Stage 1 of the mobile testing pyramid: cheap, fast, fully automated
# checks that need no device, emulator, or native build -- so they run on
# every push/PR that touches mobile/, not just on request. Catches type
# errors and logic/component regressions in minutes, before anything
# reaches the slow stages (mobile-detox.yml's real emulator boot,
# mobile-build.yml's full Gradle APK build -- both manual-dispatch) or a
# human's phone.

on:
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --legacy-peer-deps
      # oxlint, not eslint/typescript-eslint: typescript-eslint hard-refuses
      # to run against this project's TS 7 (the new native/Go compiler --
      # see AGENTS.md), since it depends on the old JS Program/TypeChecker
      # API that TS 7's `typescript` package no longer ships. oxlint has its
      # own Rust-based TS/JSX parser, so it isn't affected, and is fast
      # enough to belong in Stage 1 (see .oxlintrc.json for the rule set).
      - run: npm run lint

  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --legacy-peer-deps
      # --coverage enforces jest.config.js's coverageThreshold -- a
      # regression that drops coverage below the checked-in baseline fails
      # this job, not just a silent number nobody looks at.
      - run: npm test -- --ci --coverage

  metro-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-bundling-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --legacy-peer-deps
      # Bundles the JS with Metro for both platforms -- catches import
      # errors, bad native-module usage, and other issues `tsc` can't see
      # (tsc only checks types, it doesn't resolve/bundle). Doesn't build a
      # native binary (that's mobile-build.yml's Gradle step); this just
      # proves the bundle itself is sound.
      - run: npx expo export --platform ios --output-dir /tmp/export-ios
      - run: npx expo export --platform android --output-dir /tmp/export-android
