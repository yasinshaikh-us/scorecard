name: Mobile Detox (real Android emulator)

# Stage 2 of the mobile testing pyramid: real scripted UI flows (tap,
# assert, tap again) running against a real Android device -- Stage 1
# (mobile-ci.yml) only proves the JS is sound; neither it nor Stage 3's
# APK build (mobile-build.yml) actually taps through the app.
#
# This boots a real, hardware-accelerated (KVM) Android emulator
# directly on the GitHub Actions runner (reactivecircus/android-
# emulator-runner) and runs `detox test` against it for real -- Detox's
# own host-driven Jest process, not a raw APK handed to a device farm's
# instrumentation runner.
#
# That's a deliberate correction of an earlier design, which handed the
# built APKs straight to `gcloud firebase test android run`, bypassing
# `detox test` entirely. That design *looked* like it worked -- Firebase
# Test Lab reported "Passed" run after run -- but it was a false
# positive the whole time. Detox's Android architecture runs the actual
# JS test code (e2e/*.test.js) on a *host* machine (`detox test`'s own
# Jest process), which drives a thin on-device bridge over a live
# connection; the androidTest APK Detox builds contains no JS test logic
# of its own. With no host process anywhere in that pipeline, nothing
# was ever actually executing -- confirmed two independent ways: every
# run's raw instrumentation.results said "OK (0 tests)", and a direct
# database check found zero real Plaid Sandbox links ever created
# despite testPlaidLink.test.js reporting "Passed" repeatedly. Genymotion
# SaaS is Detox's own first-class-documented cloud alternative (same
# host-driven model, remote device instead of local), but needs a new
# third-party account/credentials; a real local emulator needs neither,
# and runs Detox's most mature, best-supported code path.
#
# Deliberately placed before Stage 3: this is much faster feedback than
# Stage 3's full release build, so it's the gate that has to pass before
# spending that time producing the actual human-installable binary.
# (Stage 3 builds on this same runner too -- neither stage uses a paid or
# third-party service.)
#
# Three triggers, which is the standard split for UI tests too expensive
# to run on everything: a cheap subset per change, the whole suite on a
# schedule.
#
#   * pull_request (mobile/** only) -- the SMOKE subset: the app boots,
#     renders, and can sign in. ~1 minute of device time on top of the
#     build. Deliberately NOT the full suite; nine screens of real-device
#     interaction is too slow and too flake-prone to gate every review on,
#     which is why this workflow was manual-only before.
#   * schedule -- the FULL suite, nightly, so regressions in the screens
#     smoke doesn't touch surface without anyone remembering to dispatch.
#   * workflow_dispatch -- either one, on demand, via the `suite` input.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which specs to run
        type: choice
        options: [full, smoke]
        default: full
  schedule:
    # 07:00 UTC daily.
    - cron: "0 7 * * *"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-detox.yml"

# One global group, NOT per-ref, and queued rather than cancelled.
#
# Every Stage 2 run drives the same real Supabase account and the same
# Plaid Sandbox item, so two overlapping runs are two runs writing the same
# rows -- the exact class of interference that made this suite unreliable.
# Serializing them is what makes a shared fixture safe to keep.
#
# cancel-in-progress: false because a queued run is not wasted work (it
# tests a different commit), and GitHub keeps at most one pending run per
# group, so this cannot build an unbounded backlog.
concurrency:
  group: mobile-detox
  cancel-in-progress: false

jobs:
  detox-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://bidorjtgbhuihppsznkc.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_aQX8dVkpoXE0-I9fighKew_sWNM00aJ
      # Same value baked into eas.json's development/preview profiles --
      # see mobile/README.md's "Test login" section for what this is and
      # why it's safe to commit (it can only ever mint a session for one
      # hardcoded dummy account, and is unrelated to that account's real
      # password).
      EXPO_PUBLIC_ENABLE_TEST_LOGIN: "true"
      EXPO_PUBLIC_TEST_LOGIN_SECRET: 0fa7abf661011fdbda3588269fed656a9c0de127bf53633ed0417b90326308ea
      # Same value baked into eas.json's development/preview profiles --
      # see mobile/README.md's "Test Plaid Link" section. Independently
      # rotatable from EXPO_PUBLIC_TEST_LOGIN_SECRET above -- leaking this
      # one can only ever link a Plaid Sandbox test bank to the same
      # hardcoded dummy account, using Sandbox-only credentials with no
      # access to any real bank data.
      EXPO_PUBLIC_TEST_PLAID_LINK_SECRET: 231d59221113f764eb1321d3b100ea3b4e1e513fd90f894686cdea34057df20e55
    steps:
      - uses: actions/checkout@v4

      # GitHub Actions' Ubuntu runners don't expose KVM by default --
      # without it, the emulator falls back to slow software
      # virtualization (or fails outright on some images). This udev
      # rule is the standard, documented fix (see reactivecircus/
      # android-emulator-runner's own README).
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The Android SDK's emulator ships a qemu-system-x86_64 binary
      # dynamically linked against libpulse.so.0 -- current ubuntu-latest
      # images no longer ship it by default (confirmed run 31450439614:
      # the emulator step ran for its full ~10 minutes, with Detox's host
      # Jest process genuinely executing real specs/hooks the whole time,
      # but every one timed out because qemu itself refused to start:
      # "error while loading shared libraries: libpulse.so.0: cannot open
      # shared object file"). Installing the library is enough -- audio
      # itself stays off via the emulator-options default (-noaudio).
      - name: Install libpulse0 (qemu's audio-backend dependency)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - run: npm ci --legacy-peer-deps

      # Generates android/ fresh -- not committed, same as mobile-build.yml
      # (Stage 3) does for its own release build. The
      # native tweaks this needs (plugins/withDetoxTestBuildType.js,
      # withDetoxAndroidModule.js, withDetoxTestStub.js) are applied
      # automatically as part of this.
      #
      # DETOX_ANDROID_RELEASE_CLEARTEXT=1 is read by
      # withDetoxReleaseCleartext.js -- Detox's own local host<->device
      # websocket bridge is plain ws:// (loopback-only, not real app
      # traffic), which Android blocks by default on the release build
      # type Detox instruments (confirmed via a real run's logcat:
      # DetoxWSClient retrying "at connectToServer" every ~3s, forever).
      # Deliberately set only here, not in mobile-build.yml's prebuild --
      # this override must never reach the real production app.
      - run: npx expo prebuild --platform android
        env:
          DETOX_ANDROID_RELEASE_CLEARTEXT: "1"

      # android/ only exists after prebuild (previous step), so this has to
      # run after it -- both to have something real to hash for the cache
      # key and because the restored ~/.gradle/caches needs to already be in
      # place before the build step below downloads anything into it.
      # Restore key falls back to the most recent cache for this OS even on
      # a key miss (e.g. a dependency bump), so a partial/stale cache still
      # beats a fully cold one instead of building from scratch.
      - name: Cache Gradle dependencies + build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Deliberately the SAME key as mobile-build.yml (Stage 3) rather
          # than a per-workflow one. The two builds compile different ABI
          # sets, but the bulk of ~/.gradle/caches is dependency downloads,
          # which are identical; Gradle's build-cache entries are keyed by
          # task-input hash, so the ones that differ simply miss instead of
          # colliding. Sharing means whichever stage runs first warms the
          # other -- worth ~6 minutes on the second one's first run after a
          # dependency change, versus each paying its own cold start.
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/android/build.gradle', 'mobile/android/app/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Expo prebuild's default android/gradle.properties caps the daemon at
      # -Xmx2048m -XX:MaxMetaspaceSize=512m. With org.gradle.parallel=true
      # (also a prebuild default), several Kotlin compile workers run
      # concurrently against that single 512m Metaspace budget -- attempt 5
      # of this workflow (run 31290582438) exhausted it mid-build, which
      # failed three unrelated compileDebugKotlin tasks at once
      # (expo-constants, react-native-plaid-link-sdk, expo-log-box) and then
      # left the daemon itself hung (repeated OutOfMemoryError: Metaspace on
      # an idle RMI thread, no clean failure, no exit) instead of reporting
      # the failure -- that's why that run and the one before it both needed
      # manual cancellation rather than failing outright. ubuntu-latest
      # runners have 16GB available, so there's ample headroom to just give
      # the daemon more room instead of fighting parallelism for it.
      #
      # org.gradle.caching=true turns on Gradle's own task output cache
      # (separate from the dependency cache the step above restores) --
      # without it, a warm ~/.gradle/caches still skips re-downloading
      # dependencies but every task still re-executes from scratch.
      - name: Raise Gradle daemon memory limits + enable build cache (see prior steps' comments)
        run: |
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1536m/' android/gradle.properties
          # android/gradle.properties (Expo's generated file) doesn't end
          # with a trailing newline -- `echo ... >>` alone would concatenate
          # straight onto the last line (e.g. "org.gradle.workers.max=26")
          # instead of adding a new one, corrupting that property's value
          # (run 31346936174 failed with 'For input string:
          # "26org.gradle.caching=true"' from exactly this).
          printf '\norg.gradle.caching=true\n' >> android/gradle.properties

      # Builds the app + androidTest APK pair (.detoxrc.js's
      # android.release build command) -- this is a real Gradle build,
      # 5-15 minutes typical. Doesn't need a device, so it runs before
      # the emulator boots below.
      - run: npx detox build -c android.release

      # Boots a real, hardware-accelerated emulator matching .detoxrc.js's
      # `avdName` (Pixel_API_30) directly on the runner, then runs `detox
      # test` against it for real inside `script:` -- Detox's Android
      # driver detects the already-running emulator (via `adb devices`)
      # and attaches to it instead of trying to launch a second one.
      #
      # --artifacts-location with a trailing slash means no extra
      # timestamped subdirectory gets appended (see Detox's CLI docs) --
      # a predictable path the upload step below can rely on.
      # --take-screenshots defaults to "manual", which is exactly what's
      # wanted: e2e/screenshot.js's captureScreen() calls
      # device.takeScreenshot() explicitly at meaningful points in each
      # spec, and Detox saves exactly those (no extra before/after-every-
      # test screenshots needed). --record-videos/--record-logs default
      # to "none" -- turned on for failing tests only, so a failure's
      # actual on-device video/log is available without paying to record
      # every passing run too. --loglevel trace surfaces Detox's own
      # device-connection diagnostics (run 31453370056 booted the emulator
      # for real -- see the libpulse0 fix above -- but every spec's
      # beforeAll still hit "Detox can't seem to connect to the test
      # app(s)!"; default log level doesn't say why).
      #
      # Deliberately ONE line, no backslash continuations: run
      # 31453370056's log showed "Invalid testPattern \ supplied" and
      # zero files under e2e/artifacts/ despite --record-logs failing --
      # this action's `script:` input doesn't join multi-line `\`-
      # continued commands the way a plain `run:` step does, so every flag
      # after the first line was silently never reaching detox test at
      # all.
      # profile: pixel_5 pins a real device hardware profile (screen size +
      # density). Without it, avdmanager falls back to a generic default --
      # avd-name: Pixel_API_30 is just this AVD's own label, not a device
      # selection, and a real run's boot log confirmed the fallback
      # resolves to a 320x640 skin, nowhere near any actual phone's
      # resolution. That made captureScreen()'s screenshots a poor visual
      # match for what a real Pixel 5 (or similar modern phone) shows --
      # this doesn't affect whether the app's *logic* is correct, only how
      # representative the screenshots are when eyeballing a UI change.
      #
      # The emulator step below was the second-slowest thing in this
      # workflow (~5m45s on a real run), and most of that was not the tests
      # -- it was downloading the system image, creating the AVD from
      # scratch, and cold-booting it, every single run. The two steps that
      # follow are the action's own documented fix: create the AVD once,
      # snapshot it, cache it, and reuse the snapshot afterwards.
      #
      # The AVD-defining inputs (api-level/target/arch/profile/avd-name)
      # and emulator-options MUST stay identical between the snapshot step
      # and the run step, or the cached snapshot doesn't apply and both the
      # cache and the extra step are wasted.
      # The trailing -v2 is a manual cache-buster, and it exists because a
      # poisoned snapshot is silent and permanent. A snapshot saved while
      # the guest was mid-boot restores into a state where
      # sys.boot_completed reads 1 but the `input` system service has not
      # published yet, so the runner's unlock keyevent throws
      # "ServiceNotFoundException: No service published for: input" and
      # the step dies before Detox starts -- no tests, no artifacts, and
      # an identical failure on every retry, because every retry restores
      # the same bad snapshot. Two consecutive runs failed this way, both
      # with "Create the AVD" skipped on a cache hit, while every earlier
      # green run had created the AVD fresh.
      #
      # Bump the suffix to force one fresh creation; the next run saves a
      # good snapshot and the cache goes back to earning its ~4 minutes.
      - name: Cache the AVD + its boot snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api30-google_apis-x86_64-pixel_5-v2

      - name: Create the AVD and generate a boot snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          avd-name: Pixel_API_30
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Resolved here rather than inline in the emulator step so the choice
      # is visible in the log. An empty value means "every spec" -- detox
      # forwards positional args to Jest as test paths.
      - name: Select which specs to run
        id: specs
        run: |
          case "${{ github.event_name }}" in
            pull_request) suite=smoke ;;
            schedule)     suite=full ;;
            *)            suite="${{ inputs.suite || 'full' }}" ;;
          esac
          echo "Running the $suite suite (trigger: ${{ github.event_name }})."
          if [ "$suite" = smoke ]; then
            echo "paths=e2e/smoke.test.js e2e/testLogin.test.js" >> "$GITHUB_OUTPUT"
          else
            echo "paths=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Detox tests on a real Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          avd-name: Pixel_API_30
          # false so an existing (cached) AVD is reused rather than
          # recreated, and -no-snapshot-save so a test run never writes
          # back over the clean snapshot the step above produced.
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: mobile
          # --retries 1 re-runs a failed spec FILE with a fresh device
          # session. This is only worth having now that a re-run starts
          # from a known state (e2e/globalSetup.js's reset plus
          # appFlows.test.js's afterEach cleanup) -- retrying into the
          # debris of the attempt that just failed would only fail the same
          # way, which is what would have happened before those existed.
          #
          # It buys exactly one genuine flake (a dropped tap, a slow
          # emulator frame) without gating a merge on it. It is not cover
          # for real failures: a spec that only passes on the retry still
          # says so in the log, and that is the signal to go fix it rather
          # than raise this number.
          script: npx detox test -c android.release --headless --cleanup --retries 1 --loglevel trace --artifacts-location e2e/artifacts/ --take-screenshots manual --record-videos failing --record-logs failing ${{ steps.specs.outputs.paths }}

      # Runs even if the test itself failed (`always()`) -- a failure is
      # exactly when seeing the actual screen/log the run ended on
      # matters most.
      - name: Upload Detox artifacts (screenshots, and video/logs for any failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detox-results
          path: mobile/e2e/artifacts/
          retention-days: 2
          if-no-files-found: warn
