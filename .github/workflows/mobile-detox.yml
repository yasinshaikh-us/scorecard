name: Mobile Detox (Firebase Test Lab)

# Stage 3 of the mobile testing pyramid: real scripted UI flows (tap,
# assert, tap again) running against a real Android virtual device --
# Stage 1 (mobile-ci.yml) only proves the JS is sound, Stage 2
# (mobile-build.yml) only proves it compiles into a real binary; neither
# actually taps through the app. This does, using Detox to build an
# instrumented Android APK pair and Firebase Test Lab's free virtual
# device quota (Spark plan: 10 virtual-device runs/day, no cost) to run
# them -- no emulator needed in this repo's CI or anywhere else.
#
# Manual-dispatch only -- this is the slowest and least-proven stage
# (a real native Gradle build plus a cloud device run), not something to
# run on every push while it's still new. See mobile/README.md for the
# one-time GCP/Firebase setup this needs and exactly why each secret is
# there.
#
# Skips cleanly (does nothing) if FIREBASE_PROJECT_ID or
# FIREBASE_SERVICE_ACCOUNT_KEY aren't set yet.

on:
  workflow_dispatch:

jobs:
  detox-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://bidorjtgbhuihppsznkc.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_aQX8dVkpoXE0-I9fighKew_sWNM00aJ
      # Same value baked into eas.json's development/preview profiles --
      # see mobile/README.md's "Test login" section for what this is and
      # why it's safe to commit (it can only ever mint a session for one
      # hardcoded dummy account, and is unrelated to that account's real
      # password).
      EXPO_PUBLIC_ENABLE_TEST_LOGIN: "true"
      EXPO_PUBLIC_TEST_LOGIN_SECRET: 0fa7abf661011fdbda3588269fed656a9c0de127bf53633ed0417b90326308ea
    steps:
      # Unconditional and first -- every later step's `run:` shell starts
      # in mobile/ (this job's default working-directory), which doesn't
      # exist until the repo is actually checked out. The secret-check
      # step below needs to run inside a checked-out repo for that reason
      # alone, even though it doesn't touch any mobile-specific file.
      - uses: actions/checkout@v4

      # The secret is passed via env: and read as a shell variable ($FIREBASE_KEY),
      # never interpolated directly into the run: script text via ${{ }} --
      # GitHub splices ${{ secrets.X }} into the script as literal text
      # before bash ever runs it, and this secret is multi-line JSON full
      # of quotes, which corrupts the generated script entirely instead of
      # producing a clean "unset" check.
      - name: Check required secrets are set
        id: check
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_KEY" ] || [ -z "$FIREBASE_PROJECT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_KEY secret and/or FIREBASE_PROJECT_ID variable not set -- skipping. See mobile/README.md's Stage 3 setup section."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Auth + device-catalog lookup moved ahead of the ~15 min Gradle build
      # on purpose -- neither needs the built APKs, and the device catalog
      # is the one part of this pipeline that drifts on Google's schedule,
      # not ours (see "Pick a Firebase Test Lab virtual device" below). No
      # reason to burn a full build cycle just to find out the catalog
      # changed again.
      - uses: google-github-actions/auth@v2
        if: steps.check.outputs.skip == 'false'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.check.outputs.skip == 'false'

      # Every prior real run of this workflow that got past the secret
      # check failed on a *different* one-off GCP project prerequisite --
      # a missing IAM role, then a disabled API -- each only discoverable
      # by waiting through the full ~13 min Gradle build first, since the
      # actual failure only surfaced in the final "gcloud firebase test
      # android run" call. Everything checked here is read-only, doesn't
      # touch Firebase Test Lab's daily device-run quota, and runs in
      # seconds -- so a fresh GCP project (or a permission that regresses
      # later) reports every missing prerequisite in one shot instead of
      # one per ~13 min build cycle.
      - name: Preflight -- verify GCP/Firebase prerequisites
        if: steps.check.outputs.skip == 'false'
        env:
          FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          MISSING=""

          # testing.googleapis.com backs the device-catalog lookup below
          # too, so it's already implicitly proven once that step passes --
          # checked explicitly anyway so a fresh project reports it up
          # front rather than failing confusingly in that later step.
          for api in testing.googleapis.com toolresults.googleapis.com; do
            ENABLED=$(gcloud services list --enabled --project "$FIREBASE_PROJECT" --filter="config.name:$api" --format="value(config.name)")
            if [ -z "$ENABLED" ]; then
              MISSING="${MISSING}\n  - API not enabled: $api -- enable at https://console.developers.google.com/apis/api/$api/overview?project=$FIREBASE_PROJECT"
            fi
          done

          SA_EMAIL=$(gcloud config get-value account 2>/dev/null)
          HAS_ROLE=$(gcloud projects get-iam-policy "$FIREBASE_PROJECT" --flatten="bindings[].members" --filter="bindings.role:roles/cloudtestservice.testAdmin AND bindings.members:$SA_EMAIL" --format="value(bindings.members)")
          if [ -z "$HAS_ROLE" ]; then
            MISSING="${MISSING}\n  - IAM role missing: $SA_EMAIL needs 'Cloud Test Admin' (roles/cloudtestservice.testAdmin) on project $FIREBASE_PROJECT"
          fi

          if [ -n "$MISSING" ]; then
            echo -e "::error::Missing GCP/Firebase prerequisites -- fix all of these, then re-run:$MISSING"
            exit 1
          fi
          echo "All known GCP/Firebase prerequisites are satisfied."

      # model=Pixel2 (this workflow's original hardcoded value) was removed
      # from Firebase Test Lab's device catalog at some point after this
      # workflow was written -- run 31293734708 failed with "'Pixel2' is
      # not a valid model" once the (separate, now-fixed) IAM permission
      # issue was resolved. Querying the live catalog and picking a
      # supported virtual device at run time, instead of hardcoding a
      # model id, means the next catalog change doesn't need another
      # find-the-right-string round trip.
      - name: Pick a Firebase Test Lab virtual device
        if: steps.check.outputs.skip == 'false'
        id: pick-device
        env:
          FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          gcloud firebase test android models list --project "$FIREBASE_PROJECT" --filter="form=VIRTUAL" --format="table(id,supportedVersionIds.list())"
          MODEL_ID=$(gcloud firebase test android models list --project "$FIREBASE_PROJECT" --filter="form=VIRTUAL AND supportedVersionIds:30" --format="value(id)" | head -n1)
          if [ -z "$MODEL_ID" ]; then
            echo "::error::No Firebase Test Lab virtual device supporting API 30 found in the catalog -- see the model list printed above and update the filter."
            exit 1
          fi
          echo "Selected device model: $MODEL_ID"
          echo "model_id=$MODEL_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        if: steps.check.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: "17"

      - run: npm ci --legacy-peer-deps
        if: steps.check.outputs.skip == 'false'

      # Generates android/ fresh -- not committed, same reasoning as
      # mobile-build.yml relying on EAS to do this server-side. The one
      # native tweak this needs (plugins/withDetoxTestBuildType.js) is
      # applied automatically as part of this.
      - run: npx expo prebuild --platform android
        if: steps.check.outputs.skip == 'false'

      # Expo prebuild's default android/gradle.properties caps the daemon at
      # -Xmx2048m -XX:MaxMetaspaceSize=512m. With org.gradle.parallel=true
      # (also a prebuild default), several Kotlin compile workers run
      # concurrently against that single 512m Metaspace budget -- attempt 5
      # of this workflow (run 31290582438) exhausted it mid-build, which
      # failed three unrelated compileDebugKotlin tasks at once
      # (expo-constants, react-native-plaid-link-sdk, expo-log-box) and then
      # left the daemon itself hung (repeated OutOfMemoryError: Metaspace on
      # an idle RMI thread, no clean failure, no exit) instead of reporting
      # the failure -- that's why that run and the one before it both needed
      # manual cancellation rather than failing outright. ubuntu-latest
      # runners have 16GB available, so there's ample headroom to just give
      # the daemon more room instead of fighting parallelism for it.
      - name: Raise Gradle daemon memory limits (see prior step's comment)
        if: steps.check.outputs.skip == 'false'
        run: sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1536m/' android/gradle.properties

      # Builds the app + androidTest APK pair (.detoxrc.js's
      # android.release build command) -- this is a real Gradle build,
      # 5-15 minutes typical.
      - run: npx detox build -c android.release
        if: steps.check.outputs.skip == 'false'

      # Uploads both APKs to Firebase Test Lab and runs the Detox specs
      # as a standard Android instrumentation test on a real virtual
      # device -- Detox's own `detox test` is deliberately not used here
      # (it expects a locally-connected device/emulator, which no leg of
      # this pipeline has). Device model comes from the "Pick a Firebase
      # Test Lab virtual device" step above, not hardcoded.
      - name: Run Detox specs on Firebase Test Lab
        if: steps.check.outputs.skip == 'false'
        env:
          FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          DEVICE_MODEL: ${{ steps.pick-device.outputs.model_id }}
        run: |
          gcloud firebase test android run \
            --project "$FIREBASE_PROJECT" \
            --type instrumentation \
            --app android/app/build/outputs/apk/release/app-release.apk \
            --test android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk \
            --device model="$DEVICE_MODEL",version=30,locale=en,orientation=portrait \
            --timeout 15m
