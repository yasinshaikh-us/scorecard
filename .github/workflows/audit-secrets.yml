name: Audit unused Actions secrets

# Reports which configured Actions secrets and variables no workflow can
# actually read. Run from here rather than a session because the agent
# proxy 403s /actions/secrets and /actions/variables, so a session can't
# even see what is configured.
#
# One-shot: delete this file once the cleanup is done.
#
# Deliberately no `if:` on the job and no inputs at all. The earlier
# attempt at this gated its jobs on a `type: boolean` workflow_dispatch
# input, and every dispatch produced a run with zero jobs -- the `inputs`
# context is empty in a job-level `if:` for a dispatch, and the obvious
# repair (`github.event.inputs.x == 'true'`) is worse, because a boolean
# input arrives as a real boolean and GitHub's `==` casts mismatched
# types to numbers: true becomes 1, 'true' becomes NaN, so the comparison
# is false exactly when the input is true. A run whose jobs all skip
# reports conclusion action_required with no jobs, which looks like a
# permissions failure and isn't one. Nothing here needs a condition, so
# nothing here has one.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # toJSON(secrets) is the only way to enumerate secret names: the
      # REST list endpoint needs a repo-admin PAT, which GITHUB_TOKEN
      # structurally cannot be. Only the KEYS are ever emitted, and the
      # JSON arrives through the environment rather than an interpolated
      # shell string, so a value containing a quote can't break out of
      # the command it lands in.
      - name: Compare configured secrets and variables against references
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail

          # github_token is injected by Actions itself, not configured by
          # anyone, so it is never a cleanup candidate.
          jq -r 'keys[]' <<<"$SECRETS_JSON" | grep -vix 'github_token' | sort -u > /tmp/have-secrets
          jq -r 'keys[]' <<<"$VARS_JSON" | sort -u > /tmp/have-vars

          # Two different questions, and conflating them is how a live
          # secret gets deleted or a dead one kept:
          #
          #   1. Does a workflow consume it? Only `secrets.NAME` under
          #      .github/workflows makes an Actions secret do anything.
          #      Nothing else in the tree can read one.
          #   2. Is the name known to the repo at all? A name can appear
          #      in .env.example, a script, or the docs while no workflow
          #      touches it -- typically because the value lives in
          #      another store (Supabase's function env) and GitHub holds
          #      a stale copy. Dead here, but worth naming rather than
          #      silently dropping.
          #
          # Bucket 1 is the verdict; bucket 2 is the explanation.
          classify() {
            local ctx="$1"
            while read -r name; do
              [ -z "$name" ] && continue
              if grep -rqE "$ctx\\.$name([^A-Za-z0-9_]|$)" .github/workflows; then
                echo "live $name consumed by a workflow"
              elif grep -rqF "$name" . --exclude-dir=.git --exclude-dir=.github; then
                local where
                where=$(grep -rlF "$name" . --exclude-dir=.git --exclude-dir=.github | head -3 | sed 's|^\./||' | tr '\n' ' ' | sed 's/ $//')
                echo "dead $name no workflow reads it; name appears in $where"
              else
                echo "dead $name referenced nowhere"
              fi
            done
          }

          classify secrets < /tmp/have-secrets > /tmp/secret-report
          classify vars < /tmp/have-vars > /tmp/var-report

          emit() {
            local label="$1" file="$2"
            local dead live
            dead=$(grep -c '^dead ' "$file" || true)
            live=$(grep -c '^live ' "$file" || true)
            {
              echo "### $label"
              echo
              # Deliberately not a flat "safe to delete": a name here may
              # still be a live secret in Supabase's function env, where
              # the app actually reads it. What is dead is the GitHub
              # copy, which nothing can consume.
              echo "**Inert ($dead)** -- no workflow can read these, so deleting the GitHub copy changes no behaviour. Read the Why column before deleting the value anywhere else:"
              echo
              if [ "$dead" -gt 0 ]; then
                echo "| Name | Why |"
                echo "| --- | --- |"
                sed -n 's/^dead \([^ ]*\) \(.*\)$/| `\1` | \2 |/p' "$file"
              else
                echo "_None._"
              fi
              echo
              echo "<details><summary>In use ($live)</summary>"
              echo
              if [ "$live" -gt 0 ]; then
                sed -n 's/^live \([^ ]*\) .*$/- `\1`/p' "$file"
              else
                echo "_None._"
              fi
              echo
              echo "</details>"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          }

          emit "Actions secrets" /tmp/secret-report
          emit "Actions variables" /tmp/var-report

          echo "--- plain-text copy for the run log ---"
          echo "SECRETS:"; cat /tmp/secret-report
          echo "VARIABLES:"; cat /tmp/var-report
